<title>科技大樓站晚餐地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
/* Layout: sticky toolbar → split list | live map (phones: list/map tab switch) */
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --sunk:#efe9e0; --ink:#272118; --muted:#76695a; --line:#e2d9cb;
  --brown:#a8701f; --brown-ink:#7a4f12; --brown-soft:#f3e5ce;
  --open:#2f7a4a; --open-soft:#ddefe2; --warn:#9a6a0a; --warn-soft:#f6ead0; --closed:#a2452f; --closed-soft:#f6e0da;
  --gA:#2f7a4a; --gB:#9a6a0a; --gC:#8a8076;
  --pin:#b04a32; --me:#2b7bd6;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.06);
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1713; --surface:#231f19; --sunk:#2b261f; --ink:#efe7da; --muted:#a99a8a; --line:#3a332a;
  --brown:#d69a45; --brown-ink:#e8b66a; --brown-soft:#3a2c19;
  --open:#7cc897; --open-soft:#1e3426; --warn:#e2b45a; --warn-soft:#3a2e15; --closed:#e58d77; --closed-soft:#3a221c;
  --gA:#7cc897; --gB:#e2b45a; --gC:#a99a8a; --pin:#e0705a; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1713; --surface:#231f19; --sunk:#2b261f; --ink:#efe7da; --muted:#a99a8a; --line:#3a332a;
  --brown:#d69a45; --brown-ink:#e8b66a; --brown-soft:#3a2c19;
  --open:#7cc897; --open-soft:#1e3426; --warn:#e2b45a; --warn-soft:#3a2e15; --closed:#e58d77; --closed-soft:#3a221c;
  --gA:#7cc897; --gB:#e2b45a; --gC:#a99a8a; --pin:#e0705a; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 14px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.code{background:var(--brown);color:#fff;font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.04em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.2vw,40px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch;font-size:14px}
.clock{font-size:13px;color:var(--muted);text-align:right;line-height:1.35}
.clock b{display:block;color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums;font-weight:700}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:10px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0}
.search:focus-within{border-color:var(--brown)}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;padding:9px 0;width:100%;min-width:0}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;padding:4px 3px;margin:-4px -3px}
.chip:focus-visible,.seg button:focus-visible{outline-offset:-2px}
.search:focus-within{box-shadow:0 0 0 2px var(--brown)}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none;position:relative}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog input:checked+.sw{background:var(--open)}
.tog input:checked+.sw::after{transform:translateX(12px)}
.tog input:focus-visible+.sw{outline:2px solid var(--brown);outline-offset:2px}
.status{font-size:12px;color:var(--muted)}



main .wrap{padding-block:16px 48px}
.viewtabs{display:none;margin-bottom:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,120px) + 12px);background:var(--sunk);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
#lmap{height:calc(100vh - var(--barh,120px) - 90px);min-height:420px;width:100%}
#svgmap{display:block;width:100%;height:auto}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media (max-width:900px){
  .viewtabs{display:inline-flex}
  .grid{grid-template-columns:minmax(0,1fr)}
  .grid[data-view="list"] .mapbox{display:none}
  .grid[data-view="map"] .listcol{display:none}
  .mapbox{position:relative;top:0}
  #lmap{height:68vh}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;scroll-margin-top:calc(var(--barh,120px) + 16px);transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--brown) 45%,var(--line))}
.card.active{border-color:var(--brown);box-shadow:0 0 0 1px var(--brown),var(--shadow)}
.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"n m p" ". b b";position:relative;gap:2px 12px;width:100%;padding:12px 14px 10px;cursor:pointer;border-radius:14px}
.head:hover .chev{color:var(--ink)}
.num{grid-area:n}.hmain{grid-area:m;min-width:0}.price{grid-area:p}.body2{grid-area:b}
.chev{position:absolute;right:14px;bottom:10px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:2px 8px 2px 6px;border-radius:999px;background:var(--sunk)}
.chev svg{transition:transform .2s}
.card.open .chev svg{transform:rotate(180deg)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.card.instant .collapse{transition:none!important}
.card.open .collapse{grid-template-rows:1fr}
.cin{overflow:hidden;min-height:0}
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.listhead .sec-h{margin:0}
.lh-actions{display:flex;gap:6px}
.btn.sm{padding:3px 10px;font-size:12px}
.head:focus-visible{outline:2px solid var(--brown);outline-offset:-2px;border-radius:14px}
.num{width:28px;height:28px;border-radius:50%;background:var(--pin);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.num.gA{background:var(--gA)}.num.gB{background:var(--gB)}.num.gC{background:var(--gC)}
.card.active .num{background:var(--ink);color:var(--bg)}
.name{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;display:block}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:2px}
.price{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.price small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.body2{display:flex;flex-direction:column;gap:6px;margin-top:8px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.pill.open{background:var(--open-soft);color:var(--open)}
.pill.later{background:var(--warn-soft);color:var(--warn)}
.pill.closed,.pill.flag{background:var(--closed-soft);color:var(--closed)}
.pill.ok{background:var(--sunk);color:var(--muted)}
.pro{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}
.grade{font-weight:700;font-size:12px;border-radius:6px;padding:0 7px;border:1.5px solid currentColor;line-height:1.5}
.grade.A{color:var(--gA)}.grade.B{color:var(--gB)}.grade.C{color:var(--gC)}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;position:relative}
.meter span{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--gA)}
.meter.B span{background:var(--gB)}.meter.C span{background:var(--gC)}
.meter::after{content:"";position:absolute;top:0;bottom:0;left:60%;border-left:1.5px dashed var(--muted);opacity:.6}
.pnum{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.pnum b{font-size:15px;color:var(--ink)}
.ord{font-size:13.5px;padding-right:64px}
.ord::before{content:"建議點法";font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--brown-ink);background:var(--brown-soft);border-radius:4px;padding:1px 6px;margin-right:8px}

.detail{border-top:1px solid var(--line);padding:12px 14px 14px 56px;display:flex;flex-direction:column;gap:12px}
.fitline{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fitline b{font-size:11px;letter-spacing:.06em;margin-right:6px;color:var(--ink)}
.fitline .avoid,.fitline .avoid b{color:var(--closed)}
.menuwrap{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.menuwrap .lab{margin-bottom:6px}
.infoline{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.detail{padding-left:16px}.pro{grid-template-columns:auto minmax(0,1fr)}.pnum{grid-column:1/-1}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brown);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink);background:var(--bg);cursor:pointer}
.btn:hover{border-color:var(--brown)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff}
.fitbox p{margin:0 0 10px}
.fitbox .lead{font-size:16px;font-weight:700}
.lab{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px}
.fitbox .avoid{color:var(--closed)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0}
.tel{user-select:all;font-variant-numeric:tabular-nums}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:12px;padding:0 8px;margin-left:8px;cursor:pointer}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 24px}
.menu h3{grid-column:1/-1;margin:10px 0 2px;font-size:12px;letter-spacing:.08em;color:var(--brown-ink);font-weight:700}
.menu h3:first-child{margin-top:0}
.mi{display:flex;gap:6px;align-items:baseline;font-size:13.5px;min-width:0;line-height:1.6}
.mi .n{flex:0 1 auto;min-width:0}
.mi .dots{flex:1 1 12px;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.mi .p{font-variant-numeric:tabular-nums;white-space:nowrap}
.mi .pg{font-size:11px;color:var(--gA);margin-left:6px;white-space:nowrap}
.mi.sigi .n{font-weight:700}
.mi.np{color:var(--muted)}
.nptag{font-style:normal;font-size:11px;margin-left:6px;padding:0 5px;border-radius:4px;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.src{font-size:12px;color:var(--muted);margin-top:12px}
.src a{color:var(--brown-ink)}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px;margin-top:10px}
.empty{color:var(--muted);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.empty .btn{margin-top:10px}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:18px 32px;font-size:12px;color:var(--muted)}
footer p{max-width:90ch;margin:0 0 6px}
footer a{color:var(--brown-ink)}

.leaflet-container{font-family:var(--body);background:var(--sunk)}
.lpin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:#b04a32;border:2.5px solid #fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s,opacity .15s}
.lpin span{transform:rotate(45deg);color:#fff;font:700 13px/1 var(--body);font-variant-numeric:tabular-nums}
.lpin.gA{background:#2f7a4a}.lpin.gB{background:#b07a12}.lpin.gC{background:#8a8076}
.lpin.dim{opacity:.22}
.lpin.active{transform:rotate(-45deg) scale(1.3);background:#1f1a14;border-color:#e8b66a}
.ltag{display:inline-block;transform:translate(-50%,-50%);color:#fff;font:700 12px/1 var(--body);padding:6px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lme{width:18px;height:18px;border-radius:50%;background:#2b7bd6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,123,214,.25)}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5;min-width:200px;color:#272118}
.pop .t{font-family:var(--display);font-size:16px;font-weight:700;display:block;margin-bottom:2px}
.pop .m{color:#76695a;display:block;margin-bottom:4px}
.pop .b{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop .b a,.pop .b button{font:inherit;font-size:12px;border-radius:6px;padding:4px 8px;text-decoration:none;border:1px solid #e2d9cb;background:#fff;color:#272118;cursor:pointer}
.pop .b a.p{background:#a8701f;border-color:#a8701f;color:#fff}
.lclu{width:52px;height:30px;border-radius:15px;background:#272118;color:#fff;border:3px solid #e8b66a;display:grid;place-items:center;font:700 13px/1 var(--body);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.rd-edge{stroke:var(--line);fill:none;stroke-linecap:round;stroke-linejoin:round}
.rd{stroke:var(--surface);fill:none;stroke-linecap:round;stroke-linejoin:round}
.rd.major{stroke:var(--brown-soft)}
.park{fill:var(--open-soft)}
.rlabel{font-size:19px;fill:var(--muted);paint-order:stroke;stroke:var(--sunk);stroke-width:4px}

/* v3: contrast, mobile, states */
:root{--on-accent:#fff;--accent-btn:#8f5f17;--gA-strong:#22633a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gA-strong:#7cc897}}
:root[data-theme="dark"]{--gA-strong:#7cc897}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on-accent:#1a1713;--accent-btn:#d69a45}}
:root[data-theme="dark"]{--on-accent:#1a1713;--accent-btn:#d69a45}
:root{--gC:#766b60}
.num,.code{color:var(--on-accent)!important}
.code{background:var(--accent-btn)}
.pill.ok,.chev{color:var(--ink)}
.card.active .num{color:var(--bg)!important}
.btn.primary{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--on-accent)}
.pill.later{color:var(--brown-ink)}
.tog .sw{background:var(--muted)}
.lpin.gB{background:#946510}
.lpin.hover{transform:rotate(-45deg) scale(1.2)}
.card.shut{background:var(--bg)}
.card.shut .name,.card.shut .pmain{color:var(--muted)}
.mi.over{color:var(--muted)}
.mi.over .p{text-decoration:line-through}
.mi.over.sigi .n{font-weight:400}
.chip:disabled{opacity:.45;cursor:default}
.price .pmain{display:block;font-size:17px}
.price small{font-weight:400}
.oseg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:6px}
.sect>.lab{margin:0}
.advice{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.advice b{font-size:11px;letter-spacing:.06em;margin-right:6px;color:var(--ink)}
.advice .avoid,.advice .avoid b{color:var(--closed)}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:0}
.info dt{color:var(--muted)}
.info dd{margin:0;min-width:0}
.info .warn{color:var(--closed)}
footer details{margin-top:6px}
footer details p{margin:6px 0 0;line-height:1.7}
.cov{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
footer summary{cursor:pointer;color:var(--ink)}
.chev{padding:6px 10px;bottom:6px}
.ord{padding-right:0}
.body2 .pro{padding-right:96px}
.ltag{transform:translate(-50%,-210%)}
.lclu{width:auto!important;min-width:34px;height:26px!important;padding:0 8px;font-size:12px!important;border-width:2px!important;border-radius:13px!important}
@media (max-width:900px){
  .bar{top:env(safe-area-inset-top,0px)}
  body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:1250}
  .bar .wrap{gap:6px;padding-block:8px}
  .bar .row:first-child{flex-wrap:nowrap}
  header .wrap{padding-block:14px 10px}
  .sub{display:none}
  .clock{display:flex;gap:6px;align-items:baseline}
  .clock b{display:inline;font-size:15px}
  .viewtabs{display:none!important}
  main .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  footer .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid!important}
  #originWrap{display:none!important}
  #lmap{height:calc(100dvh - var(--barh,60px) - 64px - env(safe-area-inset-bottom,0px) - 40px)}
}
/* bottom tab bar (phones / installed app) */

function pickSet(s){
  const out=new Set();if(!s.fit||!s.items)return out;
  const toks=s.fit.order.split(/[＋+、，,]/).map(t=>t.trim()).filter(Boolean);
  toks.forEach(raw=>{
    const tb=raw.replace(/[（(].*?[)）]/g,"").replace(/\s*[×x]\s*\d+|\d+\s*(盤|份|顆|個|碗)/g,"").replace(/^(單點|加點|再加|加)/,"").trim();
    if(tb.length<2)return;
    let best=null,bs=0;
    s.items.forEach(it=>{
      const base=it.name.replace(/[（(].*?[)）]/g,"").trim(),par=(it.name.match(/[（(](.*?)[)）]/)||[])[1]||"";
      let sc=lcs(base,tb);
      if(base===tb)sc+=6;else if(tb.includes(base))sc+=2;else if(base.includes(tb))sc+=1;
      if(par)par.split(/[，,、／/]/).forEach(p=>{p=p.trim();if(p.length>=2&&raw.includes(p))sc+=4;else if(p.length>=2&&tb.includes(p))sc+=3});

  });

}

    document.querySelectorAll("#svgpins .pin").forEach(p=>{p.setAttribute("tabindex","0");p.setAttribute("role","button");p.onclick=()=>select(p.dataset.id,"svg");p.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(p.dataset.id,"svg")}}});
    msg("地圖載入不了（可能沒有網路），先顯示簡易街道圖。");
    return;
  }
  $("svgmap").style.display="none";$("lmap").hidden=false;
  const map=L.map("lmap",{zoomControl:false,scrollWheelZoom:true});
  L.control.zoom({zoomInTitle:"放大",zoomOutTitle:"縮小"}).addTo(map);
  map.getContainer().setAttribute("role","region");map.getContainer().setAttribute("aria-label","店家地圖；同樣的店家與排序也在清單裡");
  const TILE_SRC=[
    ["https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}",'&copy; <a href="https://maps.nlsc.gov.tw/">內政部國土測繪中心</a> 臺灣通用電子地圖'],
    ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",'&copy; Esri'],
  ];
  let ti=0,errs=0;
  const tiles=L.tileLayer(TILE_SRC[0][0],{maxZoom:19,maxNativeZoom:19,attribution:TILE_SRC[0][1],referrerPolicy:"no-referrer"}).addTo(map);
  tiles.on("tileerror",()=>{if(++errs>=4&&ti<TILE_SRC.length-1){ti++;errs=0;map.attributionControl.removeAttribution(TILE_SRC[ti-1][1]);tiles.options.attribution=TILE_SRC[ti][1];map.attributionControl.addAttribution(TILE_SRC[ti][1]);tiles.setUrl(TILE_SRC[ti][0]);const lg=document.querySelector(".maplegend span:last-child");if(lg)lg.textContent="底圖 © Esri";msg("地圖讀取不順，已換一個地圖來源。")}});
  const mk={};
  const layer=L.markerClusterGroup?L.markerClusterGroup({maxClusterRadius:36,disableClusteringAtZoom:17,spiderfyOnMaxZoom:true,showCoverageOnHover:false,iconCreateFunction:c=>L.divIcon({className:"",html:'<div class="lclu" role="img" aria-label="'+c.getChildCount()+' 家店，按 Enter 放大">'+c.getChildCount()+'<small>家</small></div>',iconSize:[46,26],iconAnchor:[23,13]})}):L.layerGroup();
  layer.addTo(map);
  const icon=s=>L.divIcon({className:"",html:'<div class="lpin g'+(s.fit?s.fit.grade:"C")+(s.id===state.active?' active':'')+'" data-lid="'+s.id+'"><span aria-hidden="true">'+(s.rank||'')+'</span><b class="sr-only">'+esc((s.rank?s.rank+'. ':'')+s.name+'，'+status(s).txt+'，步行 '+s.min+' 分')+'</b></div>',iconSize:[30,30],iconAnchor:[15,36],popupAnchor:[0,-36]});
  const pop=s=>{const st=status(s);return '<div class="pop"><span class="t">'+esc(s.name)+'</span><span class="m">'+esc(st.txt)+'・步行 '+s.min+' 分</span>'+(s.fit?'<div>'+esc(s.fit.order)+'</div><div><b>'+s.fit.protein+' g</b> 蛋白質・'+(s.fit.est?'約 ':'')+'$'+s.fit.price+'</div>':'')+'<div class="b"><a class="p" href="'+gmWalk(s)+'" target="_blank" rel="noopener">步行路線</a><button data-more="'+s.id+'">看菜單</button></div></div>'};
  SHOPS.forEach(s=>{const m=L.marker(s.ll,{icon:icon(s),title:s.name,keyboard:true,riseOnHover:true});layer.addLayer(m);
    m.bindPopup(()=>pop(s),{autoPanPadding:[30,30]});
    m.on("click",()=>{setActive(s.id);if(innerWidth>900){const c=$("c-"+s.id);if(c)c.scrollIntoView({behavior:RM()?"auto":"smooth",block:"nearest"})}});
    mk[s.id]=m});
  $("lmap").addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ")return;
    const icon=e.target.closest&&e.target.closest(".leaflet-marker-icon");if(!icon)return;
    const pin=icon.querySelector(".lpin");
    if(pin&&pin.dataset.lid){e.preventDefault();e.stopPropagation();const id=pin.dataset.lid;setActive(id);mk[id].openPopup();setTimeout(()=>{const a=document.querySelector(".leaflet-popup a, .leaflet-popup button");if(a)a.focus()},60);return}
    if(icon.querySelector(".lclu")&&layer._featureGroup){e.preventDefault();e.stopPropagation();layer._featureGroup.eachLayer(l=>{if(l._icon===icon&&l.zoomToBounds){l.zoomToBounds({padding:[40,40]});map.once("moveend",()=>{const lm=$("lmap");lm.setAttribute("tabindex","0");lm.focus({preventScroll:true});msg("已放大，按 Tab 繼續選店家。")})}})}
  },true);
  map.on("popupopen",e=>{const el=e.popup.getElement(),src=e.popup._source&&e.popup._source.getElement&&e.popup._source.getElement();
    el.setAttribute("role","dialog");el.setAttribute("aria-label",(el.querySelector(".t")||{}).textContent||"店家");
    const x=el.querySelector(".leaflet-popup-close-button");if(x){x.setAttribute("aria-label","關閉");x.setAttribute("title","關閉")}
    el.addEventListener("keydown",k=>{if(k.key==="Escape"){k.stopPropagation();k.preventDefault();map.closePopup();if(src)src.focus()}});
    const b=el.querySelector("[data-more]");if(b)b.onclick=()=>{map.closePopup();select(b.dataset.more,"popup")}});
  map.createPane("tags").style.zIndex=550;
  const tag=(ll,txt,bg,kg)=>L.marker(ll,{icon:L.divIcon({className:"",html:'<span class="ltag'+(kg?' kg':'')+'" style="background:'+bg+'">'+txt+'</span>',iconSize:[0,0]}),interactive:false,keyboard:false,pane:"tags"}).addTo(map);
  tag(ORIGINS.kagura.ll,"神樂屋","#5b4a8a");
  const ring=L.circle(origin().ll,{radius:400,color:"#a8701f",weight:1.5,dashArray:"5 6",fill:false,interactive:false}).addTo(map);
  let me=null,acc=null,fitted=false;
  const BOUNDS=L.latLngBounds(SHOPS.map(s=>s.ll).concat([STATION])).pad(0.04);
  map.setView(STATION,16);
  function fitIfVisible(){if(!fitted&&map.getSize().x>0){innerWidth<=900?map.setView(origin().ll,16):map.fitBounds(BOUNDS);fitted=true}}
  fitIfVisible();
  const lpinOf=id=>{const m=mk[id];const el=m&&m.getElement&&m.getElement();return el&&el.querySelector(".lpin")};
  window.LM={
    sync(ids){const vis=SHOPS.filter(s=>ids.has(s.id)).sort((a,b)=>a.rank-b.rank);layer.clearLayers();vis.forEach(s=>mk[s.id].setIcon(icon(s)));if(layer.addLayers)layer.addLayers(vis.map(s=>mk[s.id]));else vis.forEach(s=>layer.addLayer(mk[s.id]))},
    highlight(id){SHOPS.forEach(s=>{const d=lpinOf(s.id);if(d)d.classList.toggle("active",s.id===id);mk[s.id].setZIndexOffset(s.id===id?1000:0)})},
    hover(id){SHOPS.forEach(s=>{const d=lpinOf(s.id);if(d)d.classList.toggle("hover",s.id===id)})},
    peek(id){const s=SHOPS.find(x=>x.id===id);if(!s)return;if(!map.getBounds().pad(-0.15).contains(s.ll))map.panTo(s.ll,{animate:!RM()});this.highlight(id)},
    focus(id){const s=SHOPS.find(x=>x.id===id);if(!s)return;if(layer.zoomToShowLayer){layer.zoomToShowLayer(mk[s.id],()=>{if(map.getZoom()>17)map.setZoom(17);LM.highlight(id);mk[s.id].openPopup()})}else{map.flyTo(s.ll,17);mk[s.id].openPopup()}},
    origin(ll,pan){ring.setLatLng(ll);if(pan)map.panTo(ll)},
    me(ll,a){if(!me){me=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="lme"></div>',iconSize:[18,18],iconAnchor:[9,9]}),title:"我的位置",zIndexOffset:900}).addTo(map);acc=L.circle(ll,{radius:a,color:"#2b7bd6",weight:1,fillOpacity:.08,interactive:false}).addTo(map)}else{me.setLatLng(ll);acc.setLatLng(ll).setRadius(a)}},
    resize(){map.invalidateSize();fitIfVisible()}
  };
  render();
}

// ---- bottom tab bar + filter sheet (phones / installed app) ----
const MQ=matchMedia("(max-width:900px)");
const homes={origin:[$("originWrap").parentNode,$("originWrap")],chips:[$("chips").parentNode,$("chips")]};
const ctlEls=[...$("filterRow").querySelectorAll(":scope > .tog, :scope > .ctl:not(#originSelWrap)")];
function placeControls(){
  if(!MQ.matches&&!$("sheet").hidden)closeSheet(true);
  if(MQ.matches){
    $("slotOrigin").appendChild($("originSeg"));$("slotChips").appendChild($("chips"));ctlEls.forEach(e=>$("slotCtl").appendChild(e));
  }else{
    $("originWrap").appendChild($("originSeg"));$("filterRow").insertBefore($("chips"),$("filterRow").children[1]||null);ctlEls.forEach(e=>$("filterRow").appendChild(e));
  }
  barH();
}
function activeFilters(){return (state.type!=="全部")+(state.openNow?1:0)+(state.maxp!==300)+(state.maxw?1:0)}
function syncTabs(){
  document.querySelectorAll(".tab[data-tab=list],.tab[data-tab=map]").forEach(t=>t.setAttribute("aria-current",t.dataset.tab===state.view));
  const n=activeFilters();$("fBadge").textContent=n?n:"";
  document.querySelector(".tab[data-tab=filter]").setAttribute("aria-label","篩選"+(n?"，已套用 "+n+" 項":""));
  const ol={kagura:"神樂屋",gps:"我的位置"}[state.origin]||"";$("tabOrigin").innerHTML='起點<small class="tsub">'+ol+'</small>';document.querySelector(".tab[data-tab=origin]").setAttribute("aria-label","起點："+origin().label);
  $("sheetApply").textContent="顯示 "+visible().length+" 家";
}
let lastFocus=null,snap=null;
const outside=()=>[document.querySelector("header"),$("bar"),document.querySelector("main"),document.querySelector("footer"),$("tabbar")];
function openSheet(mode){
  mode=mode||"filter";lastFocus=document.activeElement;snap={type:state.type,maxp:state.maxp,maxw:state.maxw,sort:state.sort,openNow:state.openNow};
  const sh=$("sheet");sh.dataset.mode=mode;$("sheetTitle").textContent=mode==="origin"?"從哪裡出發":"篩選與排序";
  $("sheetBg").hidden=false;sh.hidden=false;
  requestAnimationFrame(()=>{$("sheetBg").classList.add("on");sh.classList.add("on")});
  outside().forEach(e=>{if(e)e.inert=true});
  document.querySelectorAll(".tab[aria-haspopup]").forEach(t=>t.setAttribute("aria-expanded",t.dataset.tab===mode));
  syncTabs();setTimeout(()=>{const f=sh.querySelector(mode==="origin"?'#originSeg [aria-pressed="true"]':'.chip[aria-pressed="true"]')||sh.querySelector("button");if(f)f.focus()},60);
  document.body.style.overflow="hidden";
  history.pushState({sheet:mode},"");
}
function closeSheet(commit,fromPop){
  const sh=$("sheet");if(sh.hidden||!sh.classList.contains("on"))return;
  if(!fromPop&&history.state&&history.state.sheet)history.back();
  if(!commit&&snap){Object.assign(state,snap);sync();render()}
  save();snap=null;
  $("sheetBg").classList.remove("on");sh.classList.remove("on");sh.style.transform="";
  document.body.style.overflow="";outside().forEach(e=>{if(e)e.inert=false});
  document.querySelectorAll(".tab[aria-haspopup]").forEach(t=>t.setAttribute("aria-expanded","false"));
  setTimeout(()=>{if(!sh.classList.contains("on")){$("sheetBg").hidden=true;sh.hidden=true}},RM()?0:260);
  const lf=(lastFocus&&document.contains(lastFocus))?lastFocus:document.querySelector(".tab[data-tab=\""+(sh.dataset.mode||"filter")+"\"]");if(lf&&lf.focus)lf.focus({preventScroll:true});
}
$("sheetBg").onclick=()=>closeSheet(true);$("sheetClose").onclick=()=>closeSheet(false);
$("grab").addEventListener("click",()=>{if(!$("grab").dataset.dragged)closeSheet(true);delete $("grab").dataset.dragged});
$("sheetApply").onclick=()=>{closeSheet(true);scrollTo({top:0,behavior:RM()?"auto":"smooth"})};
$("sheetReset").onclick=()=>{Object.assign(state,{type:"全部",maxp:300,maxw:0,openNow:false,sort:"protein"});sync();render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden){e.preventDefault();closeSheet(false)}});
$("sheet").setAttribute("tabindex","-1");
$("originSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&$("sheet").dataset.mode==="origin"&&b.dataset.o!=="gps")setTimeout(()=>closeSheet(true),200)});
(function(){let y0=null,t0=0,dy=0;const g=$("grab"),sh=$("sheet");
  g.addEventListener("pointerdown",e=>{y0=e.clientY;t0=e.timeStamp;dy=0;g.setPointerCapture(e.pointerId);sh.style.transition="none"});
  g.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);if(dy>6)g.dataset.dragged=1;sh.style.transform="translateY("+dy+"px)"});
  const end=e=>{if(y0==null)return;sh.style.transition="";const v=dy/Math.max(1,e.timeStamp-t0);y0=null;(dy>90||v>.6)?closeSheet(true):(sh.style.transform="")};
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);
})();
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  const k=t.dataset.tab;
  if(k==="list"||k==="map"){if(state.view===k){if(k==="list")scrollTo({top:0,behavior:RM()?"auto":"smooth"});return}if(k==="map")history.pushState({view:"map"},"");else if(history.state&&history.state.view==="map")history.back();state.view=k;sync();save();scrollTo({top:0});return}
  $("sheet").hidden?openSheet(k):closeSheet(false);
});
MQ.addEventListener("change",placeControls);
addEventListener("popstate",e=>{
  if(!$("sheet").hidden&&$("sheet").classList.contains("on")){closeSheet(true,true);return}
  if(state.view==="map"&&!(e.state&&e.state.view==="map")){state.view="list";sync();save()}
});
function clock(){const n=tp();$("clock").innerHTML='台北時間<b>週'+WD[n.wd]+' '+String(n.d.getHours()).padStart(2,"0")+":"+String(n.d.getMinutes()).padStart(2,"0")+'</b>'}
function barH(){const r=document.documentElement.style;r.setProperty("--barh",$("bar").offsetHeight+"px");const tb=$("tabbar");if(tb)r.setProperty("--tabh",(tb.offsetHeight||0)+"px")}
$("foot").innerHTML=META.footer.split("<br>").map(p=>p.startsWith("已排除")?'<details><summary>重點排除說明</summary><p>'+p+'</p></details>':"<p>"+p+"</p>").join("")+(META.coverage?'<div class="cov"><p>'+META.coverage.replace(/<details>/,'</p><details>')+'</div>':'');
if(location.hash==="#map")state.view="map";if(location.hash==="#open")state.openNow=true;
addEventListener("offline",()=>msg("目前離線：營業狀態依手機時間計算，地圖只顯示看過的區域。"));
addEventListener("online",()=>msg("已恢復連線。"));
recompute();placeControls();sync();clock();barH();render();
document.readyState==="loading"?addEventListener("DOMContentLoaded",initMap):initMap();
addEventListener("resize",barH);
function refreshStatus(){document.querySelectorAll("#list .card").forEach(c=>{const s=SHOPS.find(x=>"c-"+x.id===c.id);if(!s)return;const st=status(s),p=c.querySelector(".meta .pill");if(p&&p.textContent!==st.txt){p.className="pill "+st.cls;p.textContent=st.txt}c.classList.toggle("shut",!(st.open||st.soon)&&st.cls!=="ok")})}
setInterval(()=>{clock();refreshStatus()},60000);
</script>
